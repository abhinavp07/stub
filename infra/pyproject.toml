[project]
name = "stub-infra"
version = "0.1.0"
description = "AWS CDK app for Stub"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-cdk-lib>=2.200",
    "constructs>=10.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
