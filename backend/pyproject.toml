[project]
name = "receipt-tracker-api"
version = "0.1.0"
description = "Receipt Scanner & Expense Tracker API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "boto3>=1.43.106",
    "python-multipart>=0.0.32",
    "fpdf2>=2.8.9",
    "pypdf>=6.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "moto[s3]>=5.2.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Tiny local-disk checks in tests don't need to be offloaded to a thread.
"tests/**" = ["ASYNC240"]

[tool.ruff.lint.isort]
# The local alembic/ migrations dir otherwise makes ruff treat the package as first-party.
known-third-party = ["alembic"]
